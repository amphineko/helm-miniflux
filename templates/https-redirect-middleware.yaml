{{- if and .Values.miniflux.ingress.enabled .Values.miniflux.ingress.httpRedirect.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ required "HTTP redirect middlewareName is required" .Values.miniflux.ingress.httpRedirect.middlewareName | quote }}
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: {{ .Values.miniflux.ingress.httpRedirect.permanent }}
{{- end }}
