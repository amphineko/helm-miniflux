{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux-gateway-https
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: miniflux
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when Gateway is enabled" .Values.gateway.name }}
      namespace: {{ required "gateway.namespace is required when Gateway is enabled" .Values.gateway.namespace }}
      sectionName: {{ required "gateway.sectionName is required when Gateway is enabled" .Values.gateway.sectionName }}
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.gateway.cors.enabled }}
      filters:
        - type: CORS
          cors:
            allowOrigins:
              {{- toYaml .Values.gateway.cors.allowOrigins | nindent 14 }}
            allowMethods:
              {{- toYaml .Values.gateway.cors.allowMethods | nindent 14 }}
            allowHeaders:
              {{- toYaml .Values.gateway.cors.allowHeaders | nindent 14 }}
            allowCredentials: {{ .Values.gateway.cors.allowCredentials }}
            maxAge: {{ int .Values.gateway.cors.maxAge }}
      {{- end }}
      backendRefs:
        - name: miniflux
          port: {{ .Values.miniflux.service.port }}
{{- end }}
