{{- $databasePassword := required "postgres.password is required" .Values.postgres.password }}
{{- $databaseURL := printf "postgres://%s:%s@postgres:5432/%s?sslmode=disable" .Values.postgres.user $databasePassword .Values.postgres.database }}
apiVersion: v1
kind: Secret
metadata:
  name: miniflux-credentials
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: miniflux
type: Opaque
stringData:
  database-url: {{ $databaseURL | quote }}
  {{- if .Values.miniflux.config.admin_password }}
  admin-password: {{ .Values.miniflux.config.admin_password | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $databasePassword | quote }}
{{- if .Values.miniflux.anubis.enabled }}
{{- $anubisKey := required "miniflux.anubis.config.ed25519_private_key_hex is required when Anubis is enabled" .Values.miniflux.anubis.config.ed25519_private_key_hex }}
---
apiVersion: v1
kind: Secret
metadata:
  name: miniflux-anubis
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: anubis
type: Opaque
stringData:
  ED25519_PRIVATE_KEY_HEX: {{ $anubisKey | quote }}
{{- end }}
{{- if .Values.weweRss.enabled }}
{{- $wewePassword := required "weweRss.database.password is required when Wewe-RSS is enabled" .Values.weweRss.database.password }}
{{- $weweDatabaseURL := printf "mysql://wewe-rss:%s@mariadb-wewerss:3306/wewe-rss?schema=public&connect_timeout=30&pool_timeout=30&socket_timeout=30" $wewePassword }}
{{- $weweAuthCode := required "weweRss.authCode is required when Wewe-RSS is enabled" .Values.weweRss.authCode }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wewe-rss-credentials
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: wewe-rss
type: Opaque
stringData:
  database-url: {{ $weweDatabaseURL | quote }}
  auth-code: {{ $weweAuthCode | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-wewerss-password
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
type: Opaque
stringData:
  password: {{ $wewePassword | quote }}
---
# The MariaDB operator owns the generated DSN Secret. Keep the object in the
# Helm manifest so an upgrade does not prune it while changing the password
# Secret reference above.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-wewerss
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "miniflux.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
type: Opaque
{{- end }}
