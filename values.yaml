miniflux:
  image:
    repository: docker.io/miniflux/miniflux
    tag: "2.3.3@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb"
    pullPolicy: "IfNotPresent"

  resources:
    requests:
      memory: "0"
      cpu: "0"
    limits:
      memory: "1024Mi"
      cpu: "1000m"

  service:
    type: "ClusterIP"
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      # - host: "miniflux.example.com"
    tls:
      # - secretName: ""
      #   hosts:
      #     - "miniflux.example.com"
    useDefaultTLSStore: false
    cors:
      enabled: false
      middlewareName: cors
      allowOrigins: []
      allowMethods: []
      allowHeaders: []
      allowCredentials: false
      maxAge: 0
      addVaryHeader: true
  anubis:
    enabled: false
    image:
      repository: ghcr.io/techarohq/anubis
      tag: "v1.23.1"
      pullPolicy: "IfNotPresent"
    resources:
      requests:
        memory: "0"
        cpu: "0"
      limits:
        memory: "256Mi"
        cpu: "250m"
    config:
      difficulty: 3
      ed25519_private_key_hex: ""
      use_remote_address: false
      webmaster_email: ""

  config:
    admin_password: null
    admin_username: null
    base_url: ""
    create_admin: false
    run_migrations: true

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "17-alpine"
    pullPolicy: "IfNotPresent"

  strategy: "Recreate"

  resources:
    requests:
      memory: "0"
      cpu: "0"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    enabled: false
    claimName: ""
    size: "10Gi"
    storageClass: ""

  database: "miniflux"
  password: null
  user: "miniflux"

weweRss:
  enabled: false

  authCode: null

  database:
    password: null

  app:
    image:
      repository: docker.io/cooderl/wewe-rss
      tag: "v2.6.1"
      pullPolicy: "IfNotPresent"

  mariadbOperator:
    persistence:
      size: "10Gi"
      storageClass: ""

  service:
    type: "ClusterIP"
    port: 4000

global:
  appName: miniflux

gateway:
  enabled: false
  # The consuming cluster supplies the Gateway and listener when enabled.
  name: ""
  namespace: ""
  sectionName: ""
  # Set this to attach the Route to more than one listener. When empty, the
  # legacy name/namespace/sectionName fields above are used.
  parentRefs: []
  hostname: ""
  filters: []
  cors:
    enabled: false
    allowOrigins: []
    allowMethods: []
    allowHeaders: []
    allowCredentials: false
    maxAge: 0
